spring:
  application:
    name: secure-notes-service

  datasource:
    url: jdbc:postgresql://localhost:5432/secret_notes
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
